<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mambo Blocks</title>
<link rel="stylesheet" href="./css/app.css">
</head>
<body>
<div id="app">
  <header>
    <h1>Mambo Blocks</h1>
    <label class="namefield">
      your name
      <input id="name" type="text" placeholder="e.g. Sam" autocomplete="off" maxlength="40">
    </label>
    <button id="submit" class="go">Send to teacher</button>
    <span id="status" class="status"></span>
  </header>

  <main>
    <div id="blockly"></div>
    <aside id="side">
      <h2>What it will do</h2>
      <pre id="steps"></pre>
      <p class="hint">
        Your teacher flies the drone from their laptop. Build your flight,
        put your name in, then tap <strong>Send to teacher</strong>.
      </p>
    </aside>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/blockly/12.3.1/blockly.min.js"></script>
<script type="module" src="./js/student.js"></script>
</body>
</html>
