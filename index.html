<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mambo Blocks</title>
<style>
  :root {
    --bg: #f4f6fa;
    --panel: #ffffff;
    --ink: #1d2433;
    --muted: #6b7688;
    --line: #dfe4ec;
    --accent: #2563eb;
    --ok: #16a34a;
    --danger: #dc2626;
    --warn: #d97706;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    padding: 10px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }

  h1 {
    font-size: 17px;
    margin: 0 8px 0 0;
    font-weight: 650;
    letter-spacing: -0.01em;
  }

  .readouts { display: flex; gap: 14px; align-items: center; margin-right: auto; }

  .readout { font-size: 12px; color: var(--muted); }
  .readout .value { display: block; font-size: 15px; color: var(--ink); font-weight: 600; }
  .readout .value.low { color: var(--danger); }

  .pill {
    font-size: 13px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    background: #eef1f6;
    color: var(--muted);
  }
  .pill.ok { background: #dcfce7; color: #166534; }
  .pill.busy { background: #fef3c7; color: #92400e; }
  .pill.off { background: #eef1f6; color: var(--muted); }

  button {
    font: inherit;
    font-weight: 600;
    border: 0;
    border-radius: 10px;
    padding: 12px 18px;
    min-height: 46px;
    color: #fff;
    background: var(--accent);
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  button:disabled { opacity: 0.4; }
  button.ghost { background: #e8ecf3; color: var(--ink); }
  button.go { background: var(--ok); }
  button.stop {
    background: var(--danger);
    font-size: 18px;
    padding: 12px 26px;
    box-shadow: 0 2px 0 #991b1b;
  }

  main { flex: 1; display: flex; min-height: 0; }

  #blockly { flex: 1; min-width: 0; }

  #log {
    width: 260px;
    border-left: 1px solid var(--line);
    background: var(--panel);
    padding: 10px 12px;
    overflow-y: auto;
    font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--muted);
    -webkit-overflow-scrolling: touch;
  }

  #warning {
    display: none;
    padding: 10px 14px;
    background: #fef3c7;
    color: #7c2d12;
    font-size: 14px;
    border-bottom: 1px solid #fde68a;
  }
  #warning.show { display: block; }

  @media (max-width: 820px) {
    #log { display: none; }
    .readouts { order: 3; width: 100%; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Mambo Blocks</h1>
    <span id="status" class="pill off">Not connected</span>
    <div class="readouts">
      <div class="readout">battery<span id="battery" class="value">--</span></div>
      <div class="readout">state<span id="state" class="value">--</span></div>
    </div>
    <button id="connect" class="ghost">Connect drone</button>
    <button id="run" class="go" disabled>Run</button>
    <button id="land" class="ghost" disabled>Land</button>
    <button id="stop" class="stop">STOP</button>
  </header>

  <div id="warning">
    This browser has no Web Bluetooth. On iPad, open this page in
    <strong>Bluefy</strong> — Safari cannot talk to the drone.
  </div>

  <main>
    <div id="blockly"></div>
    <div id="log"></div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/blockly/12.3.1/blockly.min.js"></script>
<script>
  if (!navigator.bluetooth) document.getElementById('warning').classList.add('show');
</script>
<script type="module" src="./js/app.js"></script>
</body>
</html>
